name: switchproof
services:
  falkor:
    image: falkordb/falkordb:v4.22.1
    ports: ["127.0.0.1:16379:6379"]
    environment:
      REDIS_ARGS: --requirepass switchproof-local-only
      FALKORDB_ARGS: TIMEOUT 10000
      BROWSER: "0"
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "switchproof-local-only", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  neo4j:
    image: neo4j:5.26.0-community
    ports: ["127.0.0.1:17687:7687", "127.0.0.1:17474:7474"]
    environment:
      NEO4J_AUTH: neo4j/switchproof-local-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p switchproof-local-only 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
