[project]
name = "switchproof"
version = "0.1.0"
description = "Graph-guided migration investigations with executable evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "neo4j>=5.26,<6", "falkordb>=1.8,<2", "deepdiff>=8,<9", "anthropic>=0.125,<1", "pandas>=2,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "flask>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the disposable local database containers"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
